name: build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'   # weekly: pick up new droidian/noble debs

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:noble
    steps:
      - uses: actions/checkout@v4
      - name: build click
        run: ./build-payload.sh
      - name: smoke test
        run: ./smoke-payload.sh out/*.click
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-hybris-click
          path: out/*.click
